<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Many Hands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2c-3 3-5 6-5 9a5 5 0 0 0 10 0c0-3-2-6-5-9Z" fill="#3f7350" />
          <path d="M12 12v10" stroke="#2c5138" stroke-width="1.4" stroke-linecap="round" />
        </svg>
        Many Hands
      </div>
      <div class="auth-area">
        <input id="email" placeholder="email" />
        <input id="password" type="password" placeholder="password" />
        <button id="emailSignUp">Sign Up</button>
        <button id="emailSignIn">Sign In</button>
        <button id="googleSignIn">Sign In with Google</button>
        <button id="signOut">Log Out</button>
      </div>
    </header>

    <div class="wrap">
      <div id="userStatus"></div>

      <div class="eyebrow leaf">✦ Your account</div>
      <h2 class="section-title">Profile</h2>
      <div class="stitch-rule"></div>
      <div class="card">
        <label>Display Name</label>
        <input id="profileDisplayName" />
        <label>Username</label>
        <input id="profileUsername" />
        <label>Bio</label>
        <textarea id="profileBio"></textarea>
        <div class="row">
          <button id="loadProfileBtn">Load Profile</button>
          <button id="updateProfileBtn">Update Profile</button>
        </div>
        <label>Profile Photo</label>
        <input id="profilePhoto" type="file" accept="image/*" />
        <div class="row">
          <button id="uploadProfilePhotoBtn">Upload Profile Photo</button>
        </div>
        <img id="profilePhotoPreview" src="" alt="" />
      </div>

      <div class="eyebrow amber">📍 See something out of place?</div>
      <h2 class="section-title">New Request</h2>
      <div class="stitch-rule"></div>
      <div class="card">
        <label>Location</label>
        <input id="location" />
        <label>Size</label>
        <input id="size" />
        <label>Description</label>
        <textarea id="description"></textarea>
        <label>Importance</label>
        <input id="importance" />
        <label>Amount</label>
        <select id="amount">
          <option value="low">low</option>
          <option value="med">med</option>
          <option value="high">high</option>
        </select>
        <label>People Needed</label>
        <input id="peopleNeeded" type="number" min="1" step="1" value="1" />
        <label>Image</label>
        <input id="image" type="file" accept="image/*" />
        <div class="row">
          <button id="uploadBtn">Upload Image</button>
          <button id="createBtn">Create Request (uses uploaded image)</button>
        </div>
        <img id="imagePreview" src="" alt="" />
      </div>

      <pre id="out"></pre>

      <div class="eyebrow rose">🗂 Community requests</div>
      <h2 class="section-title">Open Requests</h2>
      <div class="stitch-rule"></div>
      <div id="requestsList"></div>
      <div id="requestDetail"></div>

      <div class="eyebrow leaf">🏆 Recognition</div>
      <h2 class="section-title">Leaderboard</h2>
      <div class="stitch-rule"></div>
      <ol id="leaderboardList"></ol>
      <div class="row">
        <button id="refreshLeaderboardBtn">Refresh Leaderboard</button>
      </div>
    </div>

    <!-- Firebase (compat) SDK for auth in the browser -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
